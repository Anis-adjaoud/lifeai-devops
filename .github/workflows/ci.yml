name: CI · qualité et plan Terraform

# Pipeline de vérification. Il tourne sur les pull requests qui visent `main`,
# et peut être relancé manuellement.
#
#   PR develop → main     → valide et publie le plan Terraform, sans rien appliquer
#
# Le déploiement en dev est un pipeline distinct (cd-dev.yml), déclenché par
# le push sur `develop`. Le déploiement en production est également un
# pipeline distinct (cd-prod.yml), déclenché par la fusion de la pull request.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  TF_VAR_twilio_account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
  TF_VAR_twilio_auth_token: ${{ secrets.TWILIO_AUTH_TOKEN }}
  TF_VAR_oauth_client_json: ${{ secrets.OAUTH_CLIENT_JSON }}

permissions:
  contents: read
  id-token: write
  pull-requests: write # pour publier le plan en commentaire de la PR

jobs:
  # ── Portes de qualité — en parallèle, bloquantes pour la suite ─────────────
  #
  # Définies dans qualite.yml et partagées avec cd-dev.yml et cd-prod.yml.
  # La PR vise la production : c'est donc prod.tfvars que checkov doit scanner.
  qualite:
    uses: ./.github/workflows/qualite.yml
    with:
      tfvars: terraform/env/prod.tfvars

  # ── Pull request vers main : on planifie, on n'applique rien ───────────────

  plan:
    name: Plan Terraform (production)
    if: github.event_name == 'pull_request'
    needs: qualite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.12"

      - run: terraform init -reconfigure -input=false -backend-config="prefix=env/prod"

      - name: Plan
        # -lock=false : la lecture du state pour ce plan ne doit pas bloquer
        # un déploiement de production qui tournerait au même moment. Le
        # fichier binaire produit (tfplan) est ce qui sera réellement appliqué
        # par la CD : si le state a changé entre-temps, `terraform apply
        # tfplan` le détectera et échouera plutôt que d'appliquer un plan
        # périmé.
        run: |
          terraform plan -no-color -lock=false \
            -var-file=env/prod.tfvars \
            -var="image_tag=${{ github.event.pull_request.head.sha }}" \
            -out=tfplan

      - name: Publier le plan en commentaire de la PR
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const plan = execSync('terraform show -no-color tfplan', { cwd: 'terraform', maxBuffer: 1024 * 1024 * 20 }).toString();
            const extrait = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n… plan tronqué, voir les logs du job.'
              : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Plan Terraform — production\n\nCe que la fusion de cette PR appliquera en production. **Rien n'est appliqué à ce stade** — la CD (\`cd-prod.yml\`) appliquera ce plan exact après fusion.\n\n<details><summary>Déplier le plan</summary>\n\n\`\`\`hcl\n${extrait}\n\`\`\`\n\n</details>`
            });

      - name: Transmettre le plan à la CD
        # Nommé par numéro de PR : c'est ce que la CD utilisera pour
        # retrouver ce plan précis une fois la PR fusionnée dans main.
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-pr-${{ github.event.pull_request.number }}
          path: terraform/tfplan
          retention-days: 14
