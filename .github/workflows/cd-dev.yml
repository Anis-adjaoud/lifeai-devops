name: CD · déploiement dev

# Second pipeline, déclenché par un push sur `develop` — la branche de
# travail. Pas de revue de pull request ici : `develop` sert justement
# d'environnement de validation avant l'ouverture d'une PR vers `main` (voir
# ci.yml, qui prend le relais sur cette PR, et cd-prod.yml pour la fusion).
#
# AUCUN filtre `paths:` ici, volontairement. Ce pipeline est le seul à
# construire des images, et il les tague avec le SHA du commit. Toute la
# promotion vers la production repose sur cet invariant : « chaque commit de
# `develop` possède une image `lifeai-api:<sha>` dans Artifact Registry ».
# ci.yml fige `image_tag = <SHA du head de la PR>` dans le plan Terraform, et
# cd-prod.yml se contente de retaguer cette image en `:latest` — ni l'un ni
# l'autre ne sait reconstruire.
#
# Un filtre `paths:` casse cet invariant en silence : un commit de fusion
# `main` → `develop` (resynchronisation courante) ne touche aucun fichier, donc
# aucun chemin ne correspond, donc aucune image n'est construite. La PR
# suivante vers `main` échoue alors en CD sur un `NOT_FOUND` Artifact Registry.
# Le coût d'un build inutile sur un commit de documentation est très inférieur
# à celui d'une production bloquée.
on:
  push:
    branches: [develop]

  # Permet de redéployer `develop` à l'identique, sans nouveau commit.
  workflow_dispatch: {}

env:
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lifeai/lifeai-api

permissions:
  contents: read
  id-token: write

jobs:
  # Les mêmes portes qu'en CI sont rejouées sur `develop`, pour la même
  # raison que dans cd-prod.yml : redondant en principe (le code vient de
  # commits déjà vérifiés par ci.yml sur une éventuelle PR), mais peu coûteux,
  # et ça garantit que `develop` est vérifiée pour elle-même à l'instant du
  # déploiement.
  # var_file de DEV ici : c'est cet environnement que ce pipeline déploie
  # (cd-prod.yml vérifie de son côté sur prod.tfvars).
  qualite:
    uses: ./.github/workflows/qualite.yml
    with:
      tfvars: terraform/env/dev.tfvars

  build:
    name: Construction de l'image
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Déploiement dev
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ steps.sortie.outputs.service_url }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.12"

      - run: terraform init -reconfigure -input=false -backend-config="prefix=env/dev"

      - name: Apply (dev)
        env:
          TF_VAR_twilio_account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TF_VAR_twilio_auth_token: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TF_VAR_oauth_client_json: ${{ secrets.OAUTH_CLIENT_JSON }}
        run: |
          terraform apply -auto-approve \
            -var-file=env/dev.tfvars \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="image_tag=${{ github.sha }}"

      - id: sortie
        run: echo "service_url=$(terraform output -raw service_url)" >> "$GITHUB_OUTPUT"

      - name: Le service dev répond-il ?
        run: |
          url=$(terraform output -raw service_url)
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 "$url")
          echo "$url -> HTTP $code"
          test "$code" = "200" || { echo "Le service dev ne répond pas correctement."; exit 1; }
