name: CD · déploiement production

# Second pipeline, déclenché par la FUSION d'une pull request dans `main`.
#
# La porte de contrôle est la pull request elle-même : elle exige une revue,
# affiche le diff du code, le résultat des tests et le plan Terraform de
# production. Rien n'atteint `main` — donc la production — sans être passé par
# là, à condition que la protection de branche soit configurée (voir README).
#
# `main` reflète ainsi l'état réel de la production.
#
# Ce pipeline n'applique jamais un plan qu'il a lui-même recalculé : il
# retrouve la PR fusionnée dans le commit qui a déclenché ce push, télécharge
# le fichier de plan que `ci.yml` a produit pour cette PR (job `plan`), et
# l'applique tel quel (`terraform apply tfplan`). Ce qui a été revu dans la PR
# est donc, au bit près, ce qui est appliqué en production — sans nouveau
# calcul, sans nouvelle image reconstruite.
on:
  push:
    branches: [main]
    paths:
      - "api.py"
      - "agentic/**"
      - "nutrition/**"
      - "frontend_web/**"
      - "data/foods_table.xlsx"
      - "output/models/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "terraform/**"
      - ".github/workflows/**"

  # Permet de redéployer `main` à l'identique après un incident, sans
  # nouveau commit.
  workflow_dispatch: {}

env:
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lifeai/lifeai-api

permissions:
  contents: read
  id-token: write
  actions: read # pour retrouver le run CI et télécharger l'artefact du plan
  pull-requests: read # pour identifier la PR associée au commit fusionné

jobs:
  # Les mêmes portes qu'en CI sont rejouées sur `main`. C'est en principe
  # redondant — le code arrive d'une PR déjà validée — mais peu coûteux, et
  # cela garantit que `main` est vérifié pour lui-même : une fusion mal
  # résolue ou un push direct ne passeraient pas au travers.
  verifier:
    name: Vérifications sur main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-dev.txt
      - run: pytest

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.12"

      - name: Formatage et validation Terraform
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          var_file: terraform/env/prod.tfvars
          quiet: true
          output_format: cli
          soft_fail: false

  resolve-pr:
    name: Retrouver la PR fusionnée
    needs: verifier
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Identifier la PR associée à ce commit
        # Fonctionne quelle que soit la stratégie de fusion (merge commit,
        # squash, rebase) : GitHub associe toujours le commit résultant à la PR
        # d'origine via cette API.
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_json=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0]')
          number=$(echo "$pr_json" | jq -r '.number // empty')
          head_sha=$(echo "$pr_json" | jq -r '.head.sha // empty')
          if [ -z "$number" ] || [ -z "$head_sha" ]; then
            echo "Aucune PR associée au commit ${{ github.sha }} : impossible de retrouver le plan Terraform validé." >&2
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Promouvoir l'image de dev en production
    needs: resolve-pr
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Build once, deploy everywhere : l'image a déjà été construite et
      # poussée par cd-dev.yml quand ce commit (le head de la PR) a été
      # poussé sur `develop`. On ne la reconstruit pas — on lui ajoute juste
      # le tag :latest. C'est la même image, au bit près, qui a tourné en dev
      # et qui tourne maintenant en prod ; c'est aussi ce que le plan
      # Terraform de la CI référence (image_tag = SHA de la PR).
      - name: Ajouter le tag :latest à l'image déjà construite
        run: |
          gcloud artifacts docker tags add \
            "${{ env.IMAGE }}:${{ needs.resolve-pr.outputs.head_sha }}" \
            "${{ env.IMAGE }}:latest"

  deploy-prod:
    name: Déploiement production
    needs: [resolve-pr, build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.sortie.outputs.service_url }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.12"

      - run: terraform init -reconfigure -input=false -backend-config="prefix=env/prod"

      - name: Récupérer le plan validé par la CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ needs.resolve-pr.outputs.head_sha }}" \
            --jq '[.workflow_runs[] | select(.name=="CI · qualité et plan Terraform" and .conclusion=="success")] | first | .id')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "Aucun run CI réussi trouvé pour le SHA ${{ needs.resolve-pr.outputs.head_sha }}." >&2
            exit 1
          fi
          gh run download "$run_id" -n "tfplan-pr-${{ needs.resolve-pr.outputs.pr_number }}" --dir .

      - name: Apply (production)
        # Applique le plan tel quel : aucune variable n'est repassée, tout
        # est déjà figé dans le fichier tfplan récupéré ci-dessus. Si le state
        # a changé depuis que la CI a calculé ce plan, Terraform le détecte
        # et échoue plutôt que d'appliquer un plan périmé.
        run: terraform apply tfplan

      - id: sortie
        run: echo "service_url=$(terraform output -raw service_url)" >> "$GITHUB_OUTPUT"

      - name: La production répond-elle ?
        run: |
          url=$(terraform output -raw service_url)
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 "$url")
          echo "$url -> HTTP $code"
          test "$code" = "200" || { echo "La production ne répond pas correctement."; exit 1; }
