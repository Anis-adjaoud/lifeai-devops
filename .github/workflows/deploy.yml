name: Build & Deploy LifeAI

# Auth GCP "keyless" via Workload Identity Federation (bootstrap/bootstrap_ci.sh) —
# aucune clé de service account stockée dans GitHub.
on:
  push:
    branches: [main]
    paths:
      - "api.py"
      - "agentic/**"
      - "nutrition/**"
      - "frontend_web/**"
      - "data/foods_table.xlsx"
      - "output/models/**"
      - "Dockerfile"
      - "requirements.txt"
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

env:
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lifeai/lifeai-api

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.tf.outputs.service_url }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.12"

      - run: terraform init

      - run: |
          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="image_tag=${{ github.sha }}" \
            -var="twilio_account_sid=${{ secrets.TWILIO_ACCOUNT_SID }}" \
            -var="twilio_auth_token=${{ secrets.TWILIO_AUTH_TOKEN }}" \
            -var="oauth_client_json=${{ secrets.OAUTH_CLIENT_JSON }}"

      - id: tf
        run: echo "service_url=$(terraform output -raw service_url)" >> "$GITHUB_OUTPUT"
